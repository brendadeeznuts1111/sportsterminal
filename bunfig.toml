# bunfig.toml — Sports Terminal v3.0
# Root: /C:/Users/bobby/sportsterminal/bunfig.toml
#
# Per-environment overrides:
#   bunfig.proxy.toml  — Proxy server (deep console, no auto-install)
#   bunfig.test.toml   — Test suite (shallow console, .env.test)
#   bunfig.plugin.toml — Plugin dev (smol mode, fast GC)

# ==========================================
# RUNTIME
# ==========================================
[run]
# Hot reload only in dev; disabled for `bun run proxy:start`
watch = false

# Preload before every script: env validation + WAL + performance hooks
preload = ["./scripts/preload.ts"]

# Default env files for all bun run commands
envFile = [".env.shared", ".env.local"]

# Bun.js flags
smol = false

# Keep nested Buckeye/Kimi payloads inspectable in operator logs.
[console]
depth = 6

# ==========================================
# PACKAGE MANAGER
# ==========================================
[install]
registry = "https://registry.npmjs.org"
cache = ".bun/install/cache"
lockfile = "bun.lockb"
exact = true
# Development: auto-install missing deps; production overrides to "disable"
auto = "fallback"

# ==========================================
# TEST
# ==========================================
[test]
root = "./"
preload = "./scripts/preload.ts"
coverage = false
coverageThreshold = 0.8

# ==========================================
# WORKSPACE (Monorepo)
# ==========================================
[workspace]
packages = [
  ".",
  "frontend",
  "backend",
  "proxy",
  "shared",
]

# ==========================================
# BUNDLER
# ==========================================
[build]
target = "browser"
minify = true
sourcemap = "external"
splitting = true

# ==========================================
# SERVER DEFAULTS
# ==========================================
[serve]
port = 3000
hostname = "0.0.0.0"

# ==========================================
# DEBUG
# ==========================================
[debug]
showQueries = false
